<aside class="sidebar" id="sidebar">
    <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" title="Recolher/Expandir Sidebar">
        <span class="compact-close-label">Fechar</span>
        <span class="ui-icon icon-circle-chevron-right btn-icon" aria-hidden="true"></span>
    </button>
    <div class="panel panel-expand">
        <h2>Código Gerado</h2>
        <pre id="code-output" class="terminal-display"></pre>
    </div>

    <div class="panel panel-expand execution-output-panel">
        <h2>Saída do Terminal</h2>
        <div id="cli-output" class="terminal-display execution-history" aria-label="Histórico de tentativas"></div>
    </div>

    <div id="action-buttons" class="panel action-buttons-panel">
        <button id="run-btn" class="btn btn-run">Executar</button>
        <button id="clear-btn" class="btn btn-clear">Limpar Saída</button>
    </div>
    <section id="mission-completion" class="panel mission-completion" aria-label="Conclusão da missão" hidden>
        <p id="mission-completion-text" role="status"></p>
        <button id="continue-btn" class="btn btn-run" hidden>Continuar</button>
    </section>
</aside>
