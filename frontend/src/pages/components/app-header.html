<header id="app-header" class="app-header">
    <div class="header-brand">
        <div class="logo-area">
            <h1>ShellBlocks</h1>
            <span class="brand-divider">|</span>
            <span class="brand-tagline">Ambiente Interativo para Aprendizado de CLI</span>
        </div>
        <fieldset id="theme-control" class="theme-control" aria-label="Tema">
            <label title="Claro"><input type="radio" name="theme" value="light" aria-label="Claro" />
                <span class="theme-segment"><span class="ui-icon icon-sun" aria-hidden="true"></span></span></label>
            <label><input type="radio" name="theme" value="system" aria-label="Sistema" checked />
                <span class="theme-segment">Sistema</span></label>
            <label title="Escuro"><input type="radio" name="theme" value="dark" aria-label="Escuro" />
                <span class="theme-segment"><span class="ui-icon icon-moon" aria-hidden="true"></span></span></label>
        </fieldset>
    </div>

    <div class="header-context">
        <button id="btn-help-guide" class="btn-tool btn-guide-urgent">
            <span class="ui-icon icon-circle-question-mark btn-icon" aria-hidden="true"></span>
            Explicar Ferramenta
        </button>

        <div class="context-controls">
            <div class="context-summary">
                <span class="ui-icon icon-info icon-inline" aria-hidden="true"></span>
                <p id="level-summary-text" class="summary-text"></p>
            </div>
            <div class="progress-bar-container">
                <span id="progress-label">Nível 1/19</span>
                <div class="progress-bar-track">
                    <div id="progress-bar-fill" class="progress-bar-fill" style="width: 5%"></div>
                </div>
            </div>

            <label for="level-select" class="input-label">Missão:</label>
            <select id="level-select" class="level-select">
                <option value="">Carregando...</option>
            </select>
        </div>
    </div>
</header>
