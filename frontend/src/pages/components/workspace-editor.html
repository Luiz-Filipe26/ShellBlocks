<div class="editor-column">
    <div id="editor-toolbar" class="editor-toolbar">
        <div class="toolbar-group">
            <button id="btn-download-shell" class="btn-tool" type="button"
                title="Baixar Shell gerado (.sh)" aria-label="Baixar Shell gerado">
                <img src="../assets/icons/lucid/puzzle.svg" class="btn-icon" alt="" />
                Baixar Shell
            </button>
            <button id="btn-clear-assembly" class="btn-tool" title="Remover os blocos e manter o Script Principal">
                <img src="../assets/icons/lucid/trash.svg" class="btn-icon" alt="" />
                Limpar montagem
            </button>
        </div>
    </div>

    <details id="advanced-controls" class="advanced-controls">
        <summary>Arquivos e configurações avançadas</summary>
        <div class="advanced-controls__actions">
            <button id="btn-save-script" class="btn-tool" title="Baixar script atual (.json)">
                <img src="../assets/icons/lucid/save.svg" class="btn-icon" alt="" />
                Salvar Workspace
            </button>
            <button id="btn-load-script" class="btn-tool" title="Carregar script (.json)">
                <img src="../assets/icons/lucid/folder-open.svg" class="btn-icon" alt="" />
                Carregar Workspace
            </button>
            <button id="btn-load-defs" class="btn-tool" title="Carregar novas definições (cli_definitions.json)">
                <img src="../assets/icons/lucid/settings.svg" class="btn-icon" alt="" />
                Carregar Definições
            </button>
            <button id="btn-load-game" class="btn-tool" title="Carregar novos níveis (game_data.json)">
                <img src="../assets/icons/lucid/gamepad-2.svg" class="btn-icon" alt="" />
                Carregar Níveis
            </button>
            <button id="btn-reset-defs" class="btn-tool btn-tool-danger" title="Voltar para as configurações padrão de fábrica">
                <img src="../assets/icons/lucid/rotate-ccw.svg" class="btn-icon" alt="" />
                Resetar Fábrica
            </button>
        </div>
    </details>

    <div id="blockly-area" class="blockly-workspace-area">
        <button id="btn-maximize-workspace" class="workspace-maximize-button" type="button"
            aria-label="Maximizar workspace" title="Maximizar workspace" aria-pressed="false">
            <img id="workspace-maximize-icon" src="../assets/icons/lucid/maximize.svg" alt="" />
            <img id="workspace-minimize-icon" src="../assets/icons/lucid/minimize.svg" alt="" hidden />
        </button>
        <div id="onboarding-interceptor" class="onboarding-interceptor" role="button" tabindex="0" aria-label="Montagem indisponível: conclua Explicar Ferramenta para começar as Atividades guiadas" hidden></div>
        <div id="onboarding-notice" class="onboarding-notice" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <details id="system-log-panel" class="bottom-panel system-log-panel">
        <summary>Log do Sistema · detalhes técnicos</summary>
        <div id="system-log-container" class="log-display"></div>
    </details>
</div>
