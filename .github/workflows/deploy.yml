name: Deploy ShellBlocks

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run type-check

      - name: Executar testes
        run: npm test

      - name: Gerar artefato
        run: npm run build

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transferir Artefato
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          scp \
            dist/shellblocks-server.js \
            "$DEPLOY_USER@$DEPLOY_HOST:~/shellblocks-server.new.js"

      - name: Publicar e Reiniciar Aplicação
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -T "$DEPLOY_USER@$DEPLOY_HOST" <<'EOF'
            set -euo pipefail

            node --check ~/shellblocks-server.new.js

            mv ~/shellblocks-server.new.js ~/shellblocks-server.js

            pm2 restart shellblocks

            if ! timeout 180s curl \
              --fail \
              --silent \
              --show-error \
              --retry 90 \
              --retry-delay 2 \
              --retry-connrefused \
              --max-time 5 \
              http://localhost:7000/ \
              > /dev/null; then
              pm2 describe shellblocks || true
              pm2 logs shellblocks --lines 100 --nostream || true
              echo "ShellBlocks não respondeu corretamente após o deploy." >&2
              exit 1
            fi

            echo "ShellBlocks está respondendo corretamente."
          EOF
